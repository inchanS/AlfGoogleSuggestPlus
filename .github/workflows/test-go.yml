name: Go tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: python3 -m unittest discover -s scripts
      - run: go vet ./...
      - run: go test -race ./...
      - run: ./make.sh
