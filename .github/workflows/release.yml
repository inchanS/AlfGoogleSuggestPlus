name: Tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set package version from tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as v1.0.0" >&2
            exit 1
          fi
          echo "WORKFLOW_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Test and package
        run: |
          go vet ./...
          go test -race ./...
          ./make.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Korean release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(scripts/release_notes.py "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY")
          notes="$RUNNER_TEMP/release-notes.md"
          python3 "${args[@]}" > "$notes" && exit 0
          status=$?
          if [[ $status != 42 ]]; then exit "$status"; fi
          python3 -m venv "$RUNNER_TEMP/release-translator"
          source "$RUNNER_TEMP/release-translator/bin/activate"
          python -m pip install 'argostranslate==1.9.6'
          argospm update
          argospm install translate-en_ko
          python "${args[@]}" > "$notes"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" AlfGoogleSuggestPlus.alfredworkflow \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
